<mat-card>
    <mat-card-header>
        <mat-card-title>{{ esEdicion ? 'Editar Contenido' : 'Registrar Contenido' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <form [formGroup]="form">
            <div class="grid">
                <mat-form-field appearance="outline">
                    <mat-label>Título</mat-label>
                    <input matInput formControlName="titulo">
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>Tipo</mat-label>
                    <mat-select formControlName="tipo">
                        <mat-option value="articulo">Artículo</mat-option>
                        <mat-option value="video">Video</mat-option>
                        <mat-option value="infografia">Infografía</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <mat-form-field appearance="outline">
                <mat-label>Categoría</mat-label>
                <mat-select formControlName="categoria">
                    <mat-option value="alimentacion">Alimentación</mat-option>
                    <mat-option value="ejercicio">Ejercicio</mat-option>
                    <mat-option value="habito_saludable">Hábito Saludable</mat-option>
                    <mat-option value="advertencia">Advertencia</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Descripción</mat-label>
                <textarea  rows="3"  matInput  formControlName="descripcion"></textarea>
            </mat-form-field>

            <!--@if(form.controls.tipo.value === 'articulo'){-->
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Contenido</mat-label>
                    <textarea rows="8" matInput formControlName="contenido"></textarea>
                </mat-form-field>
            <!--}-->

            @if(form.controls.tipo.value === 'video'){
                <div class="upload-container">
                    <label>Seleccione un video</label>
                    <input type="file" accept="video/*" (change)="onArchivoSeleccionado($event)">
                </div>
            }

            <div class="actions">
                <button  mat-button  type="button" (click)="cancelar()">Cancelar</button>
                <button mat-flat-button color="primary" type="button" (click)="guardar()">Guardar</button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
