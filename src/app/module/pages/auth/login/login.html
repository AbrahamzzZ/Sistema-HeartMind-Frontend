<div class="login-wrapper">
  <mat-card class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <mat-icon>favorite</mat-icon>
      </div>

      <h1>HeartMind</h1>
      <p>Control y prevención de enfermedades cardiovasculares</p>
    </div>

    <form [formGroup]="formLogin" class="login-form" autocomplete="on" (ngSubmit)="login()">
      <mat-form-field appearance="outline">

        <mat-icon matPrefix>mail</mat-icon>
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="email" formControlName="usuario" autocomplete="username">

        @if(usuario?.hasError('required')){
          <mat-error>El correo es requerido</mat-error>
        }

        @if(usuario?.hasError('email')){
          <mat-error>Ingresa un correo válido</mat-error>
        }

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-icon matPrefix>lock</mat-icon>
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="ocultarClave ? 'password' : 'text'" formControlName="clave" autocomplete="current-password">

        <button mat-icon-button matSuffix type="button" (click)="ocultarClave = !ocultarClave">
          <mat-icon>{{ ocultarClave ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>

        @if(clave?.hasError('required')){
          <mat-error>La contraseña es requerida</mat-error>
        }
      </mat-form-field>

      <div class="actions">
        <button mat-flat-button color="primary" type="submit">
          Iniciar sesión
        </button>

        <button mat-stroked-button type="button" (click)="registrar()">
          Crear cuenta
        </button>
      </div>
    </form>
  </mat-card>
</div>
