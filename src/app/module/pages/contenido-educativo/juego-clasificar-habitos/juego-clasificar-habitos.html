<div class="contenedor-juego">

  <!-- Pendientes -->
  <div
    cdkDropList
    id="pendientes"
    #pendientesList="cdkDropList"
    [cdkDropListData]="pendientes"
    [cdkDropListConnectedTo]="categoriasConectadas"
    (cdkDropListDropped)="drop($event)"
    class="zona">

    <h3>Hábitos pendientes</h3>

    @for(item of pendientes; track item.id){

      <div
        cdkDrag
        class="item">

        {{ item.texto }}

      </div>

    }

  </div>

  <!-- Categorías -->
  <div class="categorias">

    @for(categoria of categorias; track categoria.id){

      <div class="categoria">

        <h3>{{ categoria.nombre }}</h3>

        <div
          cdkDropList
          [id]="'cat-' + categoria.id"
          [cdkDropListData]="categoria.items"
          [cdkDropListConnectedTo]="['pendientes']"
          (cdkDropListDropped)="drop($event)"
          class="zona">

          @for(item of categoria.items; track item.id){

            <div
              cdkDrag
              class="item">

              {{ item.texto }}

            </div>

          }

        </div>

      </div>

    }

  </div>

  <div class="acciones">

    <button
      mat-raised-button
      color="primary"
      (click)="validar()">

      Finalizar

    </button>

  </div>

</div>
