<div class="sidebar" [ngClass]="{ 'sidebar-collapsed': isSidebarCollapsed }">
    <div class="sidebar-header">
        <button class="sidebar-toggle-btn-inside" (click)="toggleSidebar()">
            <mat-icon>menu</mat-icon>
        </button>
    </div>

    <div class="user-info" >
        @if(!isSidebarCollapsed){
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ tipoUsuario }}</span>
        }
    </div>

    <div class="sidebar-menu">
        <ul>
            @for(lista of menuItems; track $index) {
                <li class="sidebar-menu-item">
                    <a mat-list-item 
                       [routerLink]="lista.url" 
                       class="menu-card"
                       [matTooltip]="lista.label"
                       matTooltipPosition="right"
                       [matTooltipDisabled]="!isSidebarCollapsed">
                        <div class="menu-icon-wrapper">
                            <img [src]="'image/' + lista.icon" [alt]="lista.label" class="menu-icon">
                        </div>
                        @if(!isSidebarCollapsed){
                            <div class="menu-content">
                                <span class="menu-title">{{ lista.label }}</span>
                                <span class="menu-description">{{ lista.description }}</span>
                            </div>
                        }
                    </a>
                </li>
            }
        </ul>
    </div>

    @if(!isSidebarCollapsed){
        <div class="footer-container menu-card" (click)="logout()" role="button">
            <div class="menu-icon-wrapper">
                <img src="image/logout.png" alt="cerrar sesión" class="menu-icon">
            </div>
            <div class="menu-content">
                <span class="menu-title">Logout</span>
                <span class="menu-description">Cerrar sesión</span>
            </div>
        </div>
    }@else{
        <div class="footer-container-collapsed">
            <button mat-icon-button 
                    (click)="logout()"
                    matTooltip="Cerrar sesión"
                    matTooltipPosition="right">
                <img src="image/logout.png" alt="cerrar sesión">
            </button>
        </div>
    }
</div>
