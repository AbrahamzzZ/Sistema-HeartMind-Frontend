<div class="sidebar" [ngClass]="{ 'sidebar-collapsed': isSidebarCollapsed }">
    <div class="sidebar-header">
        <button class="sidebar-toggle-btn-inside" (click)="toggleSidebar()">
            <mat-icon>menu</mat-icon>
        </button>
    </div>

    <div class="user-info" >
        @if(!isSidebarCollapsed){
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ tipoUsuario }}</span>
        }
    </div>

    <div class="sidebar-menu">
        <ul>
            <li class="sidebar-menu-item">
                @for(lista of menuItems; track $index) {
                    <a mat-list-item 
                       [routerLink]="lista.url" 
                       class="sidebar-item"
                       [matTooltip]="lista.label"
                       matTooltipPosition="right"
                       [matTooltipDisabled]="!isSidebarCollapsed">
                        <img [src]="'img/img-menu/' + lista.icon" [alt]="lista.label">
                        @if(!isSidebarCollapsed){
                            <span class="sidebar-item-text">{{ lista.label }}</span>
                        }
                    </a>
                }
            </li>
        </ul>
    </div>

    @if(!isSidebarCollapsed){
        <div class="footer-container" (click)="logout()" role="button">
            <span>Logout</span>
            <button mat-icon-button tabindex="-1">
                <img src="img/img-menu/logout.png" alt="cerrar sesión">
            </button>
        </div>
    }@else{
        <div class="footer-container-collapsed">
            <button mat-icon-button 
                    (click)="logout()"
                    matTooltip="Cerrar sesión"
                    matTooltipPosition="right">
                <img src="img/img-menu/logout.png" alt="cerrar sesión">
            </button>
        </div>
    }
</div>
